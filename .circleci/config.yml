version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  test-multiple-runs:
    docker:
      - image: cimg/node:20.11
    resource_class: large
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: "Run tests multiple times to detect flakiness"
          command: |
            echo "Running tests 5 times to detect flaky behavior..."
            for i in {1..5}; do
              echo "=== Test Run #$i ==="
              cd packages/core && yarn test:karma || echo "Run $i failed"
              cd ../..
              sleep 2
            done
      - run:
          name: "Run core package tests specifically"
          command: |
            cd packages/core
            for i in {1..3}; do
              echo "=== Core Test Run #$i ==="
              yarn test:karma || echo "Core run $i failed"
              sleep 1
            done
      - store_test_results:
          path: packages/core/coverage
      - store_artifacts:
          path: packages/core/coverage

  test-flaky-detection:
    docker:
      - image: cimg/node:20.11
    resource_class: medium
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: "Compile core package"
          command: |
            cd packages/core
            yarn compile
      - run:
          name: "Run flaky tests multiple times"
          command: |
            cd packages/core
            echo "Running flaky tests 10 times to demonstrate flakiness..."
            success_count=0
            total_runs=10
            
            for i in $(seq 1 $total_runs); do
              echo "=== Flaky Test Run #$i ==="
              # Run only flaky tests by file pattern
              if yarn test:karma --grep="Flaky Tests"; then
                echo "Run $i: PASSED"
                ((success_count++))
              else
                echo "Run $i: FAILED"
              fi
              sleep 1
            done
            
            echo "=== Flaky Test Summary ==="
            echo "Successful runs: $success_count/$total_runs"
            echo "Success rate: $(echo "scale=2; $success_count * 100 / $total_runs" | bc)%"
            
            # Fail if success rate is too low or too high (we want ~70% success rate)
            if [ $success_count -lt 4 ] || [ $success_count -gt 9 ]; then
              echo "Expected flakiness detected (success rate between 40-90%)"
              exit 0
            else
              echo "Tests are either too stable or too unstable"
              exit 1
            fi

workflows:
  test-and-detect-flaky:
    jobs:
      - test-multiple-runs
      - test-flaky-detection:
          requires:
            - test-multiple-runs